name: Playwright Python Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run tests and create report
        run: pytest -n 2 --html=reports/report.html --self-contained-html
        env:
          APP_BASE_URL: https://www.saucedemo.com
          API_BASE_URL: https://jsonplaceholder.typicode.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
      - name: Upload reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            reports/
            screenshots/
            logs/
          if-no-files-found: ignore